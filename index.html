<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sonic Friends!</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="homeBtn" class="round-btn hidden" aria-label="Go home">
  <svg viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3 Z" fill="#fff"/></svg>
</button>

<!-- ===== Menu ===== -->
<section id="screen-menu" class="screen">
  <h1 class="title">Sonic Friends!</h1>
  <div class="menu">
    <button class="menu-card" data-game="meet" aria-label="Meet the characters">
      <span class="menu-art" id="menuArtMeet"></span>
      <span class="menu-label">Meet</span>
    </button>
    <button class="menu-card" data-game="find" aria-label="Find the character">
      <span class="menu-art">
        <svg viewBox="0 0 100 100">
          <circle cx="44" cy="44" r="28" fill="#fff" stroke="#2563d8" stroke-width="7"/>
          <line x1="65" y1="65" x2="88" y2="88" stroke="#2563d8" stroke-width="11" stroke-linecap="round"/>
          <text x="44" y="57" font-size="36" text-anchor="middle" fill="#2563d8" font-weight="bold">?</text>
        </svg>
      </span>
      <span class="menu-label">Find</span>
    </button>
    <button class="menu-card" data-game="match" aria-label="Memory match">
      <span class="menu-art">
        <svg viewBox="0 0 100 100">
          <rect x="12" y="22" width="36" height="50" rx="8" fill="#f6b73c" stroke="#c98a12" stroke-width="3" transform="rotate(-8 30 47)"/>
          <rect x="52" y="22" width="36" height="50" rx="8" fill="#42a5f5" stroke="#1565c0" stroke-width="3" transform="rotate(8 70 47)"/>
          <path d="M30 38 l3.5 7 8 1 -5.8 5.6 1.4 8 -7.1 -3.8 -7.1 3.8 1.4 -8 -5.8 -5.6 8 -1 Z" fill="#fff" transform="rotate(-8 30 47)"/>
          <path d="M70 38 l3.5 7 8 1 -5.8 5.6 1.4 8 -7.1 -3.8 -7.1 3.8 1.4 -8 -5.8 -5.6 8 -1 Z" fill="#fff" transform="rotate(8 70 47)"/>
        </svg>
      </span>
      <span class="menu-label">Match</span>
    </button>
  </div>
</section>

<!-- ===== Meet the characters ===== -->
<section id="screen-meet" class="screen hidden">
  <div id="meetGrid" class="grid meet-grid"></div>
</section>

<!-- ===== Find the character ===== -->
<section id="screen-find" class="screen hidden">
  <div class="find-top">
    <div id="stars" class="stars" aria-label="Stars earned"></div>
    <button id="repeatBtn" class="round-btn yellow" aria-label="Hear it again">
      <svg viewBox="0 0 24 24">
        <path d="M4 9 H8 L13 4 V20 L8 15 H4 Z" fill="#fff"/>
        <path d="M16 8 Q19 12 16 16 M18.5 5.5 Q23 12 18.5 18.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div id="findGrid" class="grid find-grid"></div>
</section>

<!-- ===== Memory match ===== -->
<section id="screen-match" class="screen hidden">
  <div id="matchGrid" class="match-grid"></div>
  <button id="againBtn" class="round-btn green hidden" aria-label="Play again">
    <svg viewBox="0 0 24 24">
      <path d="M12 4 A8 8 0 1 0 20 12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 4 V12 H12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</section>

<div id="confetti" aria-hidden="true"></div>

<script src="js/characters.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
